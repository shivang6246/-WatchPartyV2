spring.application.name=watchparty-backend

# Secrets for a run outside Docker (an IDE, mvn spring-boot:run) can live in
# backend/.env.local, which is gitignored; see .env.local.example beside it.
# In Docker every value comes from the environment instead.
# Both spellings, so it is found whether the IDE starts the app from backend/
# or from the repository root.
spring.config.import=optional:file:.env.local[.properties],optional:file:backend/.env.local[.properties]

# ---- Database: Supabase (Postgres) ----------------------------------------
# Use the Session pooler string from Supabase > Connect (port 5432): it works
# over IPv4, where the direct connection is IPv6-only on most plans. In JDBC
# form: jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
# with user postgres.<project-ref>. No default: the app must not silently
# start against some other database.
spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DATABASE_USER:}
spring.datasource.password=${DATABASE_PASSWORD:}
# Supabase caps connections per project; a few are plenty for this workload.
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=10000

# Tables live in their own schema, not "public", which Supabase exposes
# through its REST API. Flyway creates and versions it; Hibernate only checks
# that the entities still match what the migrations built.
spring.flyway.schemas=watchparty
spring.jpa.properties.hibernate.default_schema=watchparty
spring.jpa.hibernate.ddl-auto=validate
# Writes happen in explicit short transactions; nothing lazy-loads in a view.
spring.jpa.open-in-view=false

# ---- Redis ----------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=3s

# ---- Server ---------------------------------------------------------------
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:10000}
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}

# ---- Actuator -------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# Scraped from the internal network only; Caddy answers /actuator/* with 404.
management.metrics.tags.application=watchparty
management.metrics.distribution.percentiles-histogram.watchparty.redis.apply=true
management.metrics.distribution.percentiles-histogram.watchparty.sync.drift=true
management.endpoint.health.probes.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html

# ---- Tokens ---------------------------------------------------------------
# 32+ bytes, base64. Injected from the environment, never committed.
# Blank when unset, which stops startup rather than signing with a default.
app.jwt.secret=${JWT_SECRET:}
app.jwt.key-id=${JWT_KEY_ID:k1}
app.jwt.issuer=${JWT_ISSUER:watchparty}
app.jwt.access-ttl=15m
app.jwt.guest-ttl=24h

app.refresh.ttl=30d
app.refresh.cookie-name=wp_refresh
# Off only for plain-HTTP local development.
app.refresh.cookie-secure=${REFRESH_COOKIE_SECURE:true}
app.refresh.cookie-domain=${REFRESH_COOKIE_DOMAIN:}

app.ws-ticket.ttl=30s

# ---- Client origins -------------------------------------------------------
# Explicit allowlist: credentialed requests make a wildcard unusable anyway.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
# Published extension id, e.g. chrome-extension://abcdefghijklmnop...
app.cors.allowed-extension-ids=${CORS_ALLOWED_EXTENSION_IDS:}

# ---- Rooms ----------------------------------------------------------------
app.room.max-members=${ROOM_MAX_MEMBERS:25}
app.room.ttl=${ROOM_TTL:24h}
# How often hot Redis state is written back to Postgres.
app.room.snapshot-interval-ms=30000
app.room.member-heartbeat-ttl=20s
# Chat and playback history are purged this long after a room closes.
app.room.retention-days=${ROOM_RETENTION_DAYS:30}
# A host who drops keeps the room this long before it passes to the
# longest-standing registered member still watching.
app.room.host-grace=${ROOM_HOST_GRACE:45s}
# A room with nobody connected closes after this long, rather than lingering
# until the 24h expiry.
app.room.empty-grace=${ROOM_EMPTY_GRACE:10m}
# How often the watchdog acts on due host hand-offs and empty rooms.
app.room.watchdog-interval-ms=5000
app.room.max-queue=${ROOM_MAX_QUEUE:50}

# ---- In-app YouTube browsing ----------------------------------------------
# A YouTube Data API v3 key. Without one, search is disabled and the picker
# falls back to pasting a link, which needs no key.
app.youtube.api-key=${YOUTUBE_API_KEY:}
app.youtube.region=${YOUTUBE_REGION:US}

# ---- Email ----------------------------------------------------------------
# Any SMTP provider (Resend, Brevo, SES, Postmark, Gmail). With no host set,
# verification mail is written to the log instead and nothing is held back,
# so a development machine needs no mail account.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Without this the health endpoint tries to reach SMTP and reports the whole
# app down when no mail host is set (or the provider is briefly unreachable).
management.health.mail.enabled=false
app.mail.from=${MAIL_FROM:WatchParty <no-reply@localhost>}

# A verification link is single-use and expires with this.
app.verification.ttl=${VERIFICATION_TTL:24h}
# Unset follows the mail setup: enforced where mail can be sent. true or false
# overrides that, which is how the smoke run keeps hosting open.
app.verification.required=${VERIFICATION_REQUIRED:}

# Where the web client lives, for the links inside those emails.
app.web.base-url=${WEB_BASE_URL:http://localhost:3000}

# ---- Google OAuth (optional; endpoints 503 until configured) --------------
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/google/callback}
app.google.post-login-redirect=${GOOGLE_POST_LOGIN_REDIRECT:http://localhost:3000/auth/callback}

# ---- Logging --------------------------------------------------------------
logging.level.com.watchparty=${LOG_LEVEL:INFO}

